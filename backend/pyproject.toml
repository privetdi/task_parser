[project]
name = "rates-service"
version = "0.1.0"
description = "Сервис сбора курсов НБ РБ и графиков IEA с отправкой результатов на почту"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    # В 4.x API планировщика полностью другой, держимся стабильной 3.x
    "apscheduler>=3.10,<4",
    "openpyxl>=3.1",
    "playwright>=1.47",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
# Это приложение, а не библиотека: устанавливать сам проект как пакет не нужно
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
